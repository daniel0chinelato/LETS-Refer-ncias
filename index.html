<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Referências</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        /* Mantenha todo o seu CSS original aqui */
        :root { --bg-base: #050505; --bg-surface: #121212; --text-main: #f0f0f0; --text-muted: #888888; --accent: #ffffff; --danger: #ff4a4a; --brand-color: #d20a11; --radius: 12px; --grid-item-size: 320px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: "Century Gothic", "Segoe UI", sans-serif; padding: 3rem 2rem; min-height: 100vh; position: relative; }
        .logo-lets { position: absolute; top: 3rem; left: 3rem; max-height: 80px; z-index: 100; }
        header { display: flex; flex-direction: column; align-items: center; margin-bottom: 3rem; gap: 2rem; }
        .top-form { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; background: var(--bg-surface); padding: 0.8rem 1.2rem; border-radius: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 1400px; }
        .top-form input { background: transparent; border: none; color: #fff; padding: 0.5rem 1rem; width: 160px; }
        .top-form button[type="submit"] { background: #fff; border: none; padding: 0.5rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .mood-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--grid-item-size)), 1fr)); gap: 1.5rem; max-width: 1800px; margin: 0 auto; }
        .mood-item { aspect-ratio: 1 / 1; position: relative; border-radius: var(--radius); overflow: hidden; background-color: var(--bg-surface); cursor: pointer; }
        .mood-item img { width: 100%; height: 100%; object-fit: cover; }
        .mood-overlay { position: absolute; inset: 0; padding: 2rem; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); }
    </style>
</head>
<body>

    <img src="lets.png" alt="LETS" class="logo-lets" onerror="this.style.display='none'">

    <header>
        <h1>Referências</h1>
        <form id="ref-form" class="top-form">
            <input type="text" id="ref-title" placeholder="Título" required>
            <input type="text" id="ref-category" placeholder="Categoria" required>
            <input type="url" id="ref-link" placeholder="Link">
            <input type="file" id="ref-image" accept="image/*">
            <button type="submit">Salvar</button>
        </form>
    </header>

    <main><section class="mood-board" id="mood-board"></section></main>

    <script>
        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBiAp5UJ4G4ZLBvTGRrT7f-fHYcV3lE7wU",
            authDomain: "lets-refs.firebaseapp.com",
            projectId: "lets-refs",
            storageBucket: "lets-refs.firebasestorage.app",
            messagingSenderId: "339020875724",
            appId: "1:339020875724:web:3beb73dc13e1a416f23f69"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // CARREGAR DADOS DO FIRESTORE
        async function loadData() {
            const board = document.getElementById('mood-board');
            board.innerHTML = 'Carregando...';
            const snapshot = await db.collection('referencias').orderBy('id', 'desc').get();
            board.innerHTML = '';
            snapshot.docs.forEach(doc => {
                const ref = doc.data();
                const item = document.createElement('div');
                item.className = 'mood-item';
                item.innerHTML = `<img src="${ref.image}">
                                  <div class="mood-overlay">
                                    <h3>${ref.title}</h3>
                                    <button onclick="deleteRef('${doc.id}')">Remover</button>
                                  </div>`;
                board.appendChild(item);
            });
        }

        // SALVAR NO FIRESTORE
        document.getElementById('ref-form').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('ref-image').files[0];
            const reader = new FileReader();
            
            reader.onload = async (ev) => {
                const doc = { 
                    id: Date.now(), 
                    title: document.getElementById('ref-title').value, 
                    category: document.getElementById('ref-category').value,
                    image: ev.target.result 
                };
                await db.collection('referencias').add(doc);
                loadData();
            };
            reader.readAsDataURL(file);
        };

        // APAGAR
        async function deleteRef(id) {
            await db.collection('referencias').doc(id).delete();
            loadData();
        }

        loadData();
    </script>
</body>
</html>
