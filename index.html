<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LETS | Painel de Referências</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-base: #050505; --bg-surface: #121212; --bg-surface-hover: #1a1a1a;
            --text-main: #f0f0f0; --text-muted: #888888; --accent: #ffffff;
            --danger: #ff4a4a; --brand-color: #d20a11; --radius: 12px;
            --grid-item-size: 320px; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: "Century Gothic", "Segoe UI", sans-serif; padding: 3rem 2rem; min-height: 100vh; position: relative; }

        .logo-lets { position: absolute; top: 3rem; left: 3rem; max-height: 80px; z-index: 100; }

        /* --- HEADER --- */
        header { display: flex; flex-direction: column; align-items: center; margin-bottom: 3rem; gap: 2rem; }
        header h1 { font-weight: 300; letter-spacing: 4px; text-transform: uppercase; font-size: 1.2rem; color: var(--text-muted); }
        .top-form { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; background-color: var(--bg-surface); padding: 0.8rem 1.2rem; border-radius: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 1400px; }
        .top-form input { background-color: transparent; border: none; color: #fff; padding: 0.5rem 1rem; font-family: inherit; width: 160px; }
        .top-form button[type="submit"] { background-color: var(--text-main); color: var(--bg-base); border: none; padding: 0.5rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .top-form button[type="submit"]:hover { background-color: var(--brand-color); color: #fff; }

        /* --- TOOLBAR --- */
        .toolbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5rem; max-width: 1800px; margin: 0 auto 2.5rem auto; border-bottom: 1px solid #1a1a1a; padding-bottom: 1.5rem; }
        .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; }
        .filter-btn { background: transparent; border: 1px solid #333; color: var(--text-muted); padding: 0.4rem 1.2rem; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .filter-btn:hover, .filter-btn.active { background: var(--brand-color); color: #fff; border-color: var(--brand-color); }
        
        .grid-size-control { justify-self: end; display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        .size-btn { background: #222; border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .size-btn:hover { background: var(--brand-color); }

        /* --- GRID DE CARDS --- */
        .mood-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--grid-item-size)), 1fr)); gap: 1.5rem; max-width: 1800px; margin: 0 auto; }
        .mood-item { aspect-ratio: 1 / 1; position: relative; border-radius: var(--radius); overflow: hidden; background-color: var(--bg-surface); transition: transform 0.5s, box-shadow 0.5s; opacity: 0; animation: slideUpFade 0.8s forwards; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .mood-item:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 2; }
        .mood-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .mood-item:hover img { transform: scale(1.08); filter: brightness(0.35); }

        /* Overlay e Textos */
        .mood-overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 2rem 1.5rem; }
        .overlay-category { font-size: 0.7rem; color: var(--brand-color); font-weight: bold; text-transform: uppercase; margin-bottom: 0.3rem; }
        .mood-overlay h3 { font-size: 1.4rem; color: #fff; }
        .hidden-content { display: grid; grid-template-rows: 0fr; transition: 0.4s; }
        .mood-item:hover .hidden-content { grid-template-rows: 1fr; }
        .hidden-content-inner { overflow: hidden; opacity: 0; transform: translateY(10px); transition: 0.3s; pointer-events: auto; }
        .mood-item:hover .hidden-content-inner { opacity: 1; transform: translateY(0); padding-top: 1rem; }
        .card-actions { display: flex; gap: 1rem; }
        .action-btn { background: rgba(255,255,255,0.1); border: none; padding: 0.4rem 1rem; border-radius: 50px; color: #fff; cursor: pointer; transition: 0.3s; }
        .action-btn:hover { background: var(--brand-color); }

        /* MODO LISTA */
        .mood-board.list-view { grid-template-columns: 1fr; }
        .list-view .mood-item { aspect-ratio: auto; display: flex; align-items: center; gap: 1rem; padding: 1rem; min-height: 100px; }
        .list-view .mood-item img { width: 80px; height: 80px; border-radius: 8px; }
        .list-view .mood-overlay { position: static; background: none; flex: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <img src="lets.png" alt="LETS" class="logo-lets" onerror="this.style.display='none'">

    <header>
        <h1>Referências</h1>
        <form id="ref-form" class="top-form">
            <input type="text" id="ref-title" placeholder="Título" required>
            <input type="text" id="ref-category" list="categories-list" placeholder="Categoria" required>
            <datalist id="categories-list"></datalist>
            <input type="text" id="ref-desc" placeholder="Descrição">
            <input type="url" id="ref-link" placeholder="Link">
            <input type="file" id="ref-image" accept="image/*" required>
            <button type="submit">Salvar</button>
        </form>
    </header>

    <div class="toolbar">
        <div></div>
        <nav class="filters" id="filters-nav"></nav>
        <div class="grid-controls">
            <button class="size-btn" onclick="changeSize(-50)">-</button>
            <input type="range" id="grid-slider" min="150" max="600" step="50" value="320">
            <button class="size-btn" onclick="changeSize(50)">+</button>
        </div>
    </div>

    <main><section class="mood-board" id="mood-board"></section></main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBiAp5UJ4G4ZLBvTGRrT7f-fHYcV3lE7wU",
            authDomain: "lets-refs.firebaseapp.com",
            projectId: "lets-refs",
            storageBucket: "lets-refs.firebasestorage.app",
            messagingSenderId: "339020875724",
            appId: "1:339020875724:web:3beb73dc13e1a416f23f69"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const baseCategories = ['Animação', 'Logo', 'Site', 'Tipografia', 'Diversas', 'Studio'];
        let references = [];

        async function load() {
            const snap = await db.collection('referencias').orderBy('id', 'desc').get();
            references = snap.docs.map(d => ({...d.data(), firebaseId: d.id}));
            render();
            updateFilters();
        }

        function updateFilters() {
            const nav = document.getElementById('filters-nav');
            const cats = [...new Set([...baseCategories, ...references.map(r => r.category)])];
            nav.innerHTML = cats.map(c => `<button class="filter-btn" onclick="filter('${c}')">${c}</button>`).join('');
            document.getElementById('categories-list').innerHTML = cats.map(c => `<option value="${c}">`).join('');
        }

        function render() {
            const board = document.getElementById('mood-board');
            board.innerHTML = references.map((ref, i) => `
                <div class="mood-item" style="animation-delay: ${i*0.05}s">
                    <img src="${ref.image}">
                    <div class="mood-overlay">
                        <span class="overlay-category">${ref.category}</span>
                        <h3>${ref.title}</h3>
                        <div class="hidden-content">
                            <div class="hidden-content-inner">
                                <p class="overlay-desc">${ref.description || ''}</p>
                                <div class="card-actions">
                                    <button class="action-btn" onclick="remove('${ref.firebaseId}')">Apagar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('ref-form').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('ref-image').files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const doc = { 
                    id: Date.now(), title: document.getElementById('ref-title').value, 
                    category: document.getElementById('ref-category').value, 
                    description: document.getElementById('ref-desc').value,
                    image: ev.target.result 
                };
                await db.collection('referencias').add(doc);
                load();
            };
            reader.readAsDataURL(file);
        };

        window.remove = async (id) => { await db.collection('referencias').doc(id).delete(); load(); };

        window.changeSize = (delta) => {
            let s = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-item-size')) + delta;
            document.documentElement.style.setProperty('--grid-item-size', Math.max(150, s) + 'px');
            if(s <= 200) document.getElementById('mood-board').classList.add('list-view');
            else document.getElementById('mood-board').classList.remove('list-view');
        };

        load();
    </script>
</body>
</html>
