<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Referências</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-base: #050505; --bg-surface: #121212; --text-main: #f0f0f0;
            --text-muted: #888888; --brand-color: #d20a11; --danger: #ff4a4a; --radius: 12px; --grid-item-size: 320px; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: sans-serif; padding: 3rem 2rem; min-height: 100vh; position: relative; }

        .logo-lets { position: absolute; top: 3rem; left: 3rem; max-height: 80px; z-index: 100; }
        @media (max-width: 900px) { .logo-lets { position: static; display: block; margin: 0 auto 2rem auto; } }

        /* Estilização do Form e Toolbar */
        header { display: flex; flex-direction: column; align-items: center; margin-bottom: 3rem; gap: 2rem; }
        .top-form { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; background: var(--bg-surface); padding: 0.8rem 1.2rem; border-radius: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 1400px; }
        .top-form input { background: transparent; border: none; color: #fff; padding: 0.5rem 1rem; width: 160px; }
        .top-form button[type="submit"] { background: var(--text-main); color: #000; border: none; padding: 0.5rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; }
        
        .toolbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.5rem; max-width: 1800px; margin: 0 auto 2.5rem auto; border-bottom: 1px solid #1a1a1a; padding-bottom: 1.5rem; }
        .filters { display: flex; gap: 0.5rem; justify-content: center; }
        .filter-btn { background: transparent; border: 1px solid #333; color: var(--text-muted); padding: 0.4rem 1.2rem; border-radius: 50px; cursor: pointer; }
        .filter-btn.active { background: var(--brand-color); color: #fff; border-color: var(--brand-color); }
        .size-btn { background: #222; border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }

        /* Grid */
        .mood-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--grid-item-size)), 1fr)); gap: 1.5rem; max-width: 1800px; margin: 0 auto; }
        .mood-item { aspect-ratio: 1 / 1; position: relative; border-radius: var(--radius); overflow: hidden; background: var(--bg-surface); cursor: pointer; }
        .mood-item img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Overlay consertado para permitir cliques na imagem */
        .mood-overlay { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 50%); display: flex; flex-direction: column; justify-content: flex-end; padding: 2rem 1.5rem; }
        .card-actions { display: flex; gap: 1rem; pointer-events: auto; } /* Apenas botões recebem clique */
        .action-btn { background: rgba(255,255,255,0.1); border: none; padding: 0.4rem 1rem; border-radius: 20px; color: #fff; cursor: pointer; }
        
        /* Modais */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--bg-surface); padding: 2.5rem; border-radius: var(--radius); width: 400px; text-align: center; }
    </style>
</head>
<body>

    <img src="lets.png" alt="LETS" class="logo-lets" onerror="this.style.display='none'">

    <header>
        <h1>Referências</h1>
        <form id="ref-form" class="top-form">
            <input type="text" id="ref-title" placeholder="Título" required>
            <input type="text" id="ref-category" placeholder="Categoria" required>
            <input type="url" id="ref-link" placeholder="Link">
            <input type="file" id="ref-image" accept="image/*">
            <button type="submit">Salvar</button>
        </form>
    </header>

    <div class="toolbar">
        <div></div>
        <nav class="filters" id="filters-nav"></nav>
        <div class="grid-controls">
            <button class="size-btn" onclick="changeSize(-50)">-</button>
            <input type="range" id="grid-slider" min="150" max="600" step="50" value="320">
            <button class="size-btn" onclick="changeSize(50)">+</button>
        </div>
    </div>

    <main><section class="mood-board" id="mood-board"></section></main>

    <script>
        // CONFIGURAÇÃO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBiAp5UJ4G4ZLBvTGRrT7f-fHYcV3lE7wU",
            authDomain: "lets-refs.firebaseapp.com",
            projectId: "lets-refs",
            storageBucket: "lets-refs.firebasestorage.app",
            messagingSenderId: "339020875724",
            appId: "1:339020875724:web:3beb73dc13e1a416f23f69"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let references = [];

        async function load() {
            const snapshot = await db.collection('referencias').get();
            references = snapshot.docs.map(doc => ({ ...doc.data(), firebaseId: doc.id }));
            render();
        }

        function render() {
            const board = document.getElementById('mood-board');
            board.innerHTML = '';
            references.forEach(ref => {
                const item = document.createElement('div');
                item.className = 'mood-item';
                // Lógica de clique: abre o link ou a imagem
                item.onclick = (e) => {
                    if(!e.target.closest('.card-actions')) {
                        if(ref.link) window.open(ref.link, '_blank');
                    }
                };
                item.innerHTML = `
                    <img src="${ref.image}">
                    <div class="mood-overlay">
                        <h3>${ref.title}</h3>
                        <div class="card-actions">
                            <button class="action-btn" onclick="deleteItem('${ref.firebaseId}')">Apagar</button>
                        </div>
                    </div>
                `;
                board.appendChild(item);
            });
        }

        async function deleteItem(id) {
            await db.collection('referencias').doc(id).delete();
            load();
        }

        document.getElementById('ref-form').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('ref-image').files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const doc = { 
                    id: Date.now(), 
                    title: document.getElementById('ref-title').value, 
                    link: document.getElementById('ref-link').value,
                    image: ev.target.result 
                };
                await db.collection('referencias').add(doc);
                load();
            };
            reader.readAsDataURL(file);
        };

        window.changeSize = (delta) => {
            let s = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-item-size')) + delta;
            document.documentElement.style.setProperty('--grid-item-size', Math.max(150, s) + 'px');
        };

        load();
    </script>
</body>
</html>
