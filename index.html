<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Referências</title>
    
    <style>
        :root {
            --bg-base: #050505;
            --bg-surface: #121212;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #ffffff;
            --danger: #ff4a4a;
            --brand-color: #d20a11; /* Cor LETS */
            --radius: 12px;
            --grid-item-size: 320px; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: "Century Gothic", "Segoe UI", sans-serif;
            padding: 3rem 2rem;
            min-height: 100vh;
            position: relative;
        }

        /* Logo no canto superior esquerdo */
        .logo-lets {
            position: absolute;
            top: 3rem;
            left: 3rem;
            max-height: 80px;
            z-index: 100;
        }

        @media (max-width: 900px) {
            .logo-lets {
                position: static;
                display: block;
                margin: 0 auto 2rem auto;
            }
        }

        /* Header */
        header {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 3rem; gap: 2rem; position: relative;
        }
        .header-top { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        
        header h1 {
            font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
            font-size: 1.2rem; color: var(--text-muted);
        }

        .history-btn {
            background: transparent; border: 1px solid #333; color: var(--text-muted);
            padding: 0.5rem 1rem; border-radius: 50px; cursor: pointer;
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .history-btn:hover { border-color: var(--text-main); color: var(--text-main); }

        /* Formulário de Inserção */
        .top-form {
            display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center;
            background-color: var(--bg-surface); padding: 0.8rem 1.2rem;
            border-radius: 100px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 1400px;
        }

        .top-form input[type="text"], .top-form input[type="url"] {
            background-color: transparent; border: none; color: var(--text-main);
            padding: 0.5rem 1rem; font-family: inherit; font-size: 0.95rem; width: 160px;
        }
        .top-form input::placeholder { color: #555; }
        .top-form input:focus { outline: none; background-color: rgba(255, 255, 255, 0.05); border-radius: 50px; }

        .top-form input[type="file"] {
            color: var(--text-muted); font-size: 0.9rem; width: 210px; display: flex; align-items: center;
        }
        .top-form input[type="file"]::-webkit-file-upload-button,
        .top-form input[type="file"]::file-selector-button {
            background-color: #222; color: var(--text-main); border: none;
            padding: 0.5rem 1rem; border-radius: 50px; cursor: pointer;
            margin-right: 10px; font-family: inherit; transition: background 0.3s ease;
        }
        .top-form input[type="file"]::-webkit-file-upload-button:hover,
        .top-form input[type="file"]::file-selector-button:hover { background-color: #333; }

        .top-form button[type="submit"] {
            background-color: var(--text-main); color: var(--bg-base); border: none;
            padding: 0.5rem 1.5rem; border-radius: 50px; cursor: pointer;
            font-weight: bold; font-size: 0.95rem; transition: all 0.3s ease;
        }
        .top-form button[type="submit"]:hover { background-color: var(--text-muted); color: #fff; }

        @media (max-width: 1100px) {
            .top-form { border-radius: var(--radius); flex-direction: column; width: 100%; max-width: 400px; }
            .top-form input[type="text"], .top-form input[type="url"], .top-form input[type="file"] { width: 100%; }
        }

        /* ==========================================
           TOOLBAR (Centralização Exata dos Filtros)
           ========================================== */
        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center; 
            gap: 1.5rem; max-width: 1800px; margin: 0 auto 2.5rem auto;
            border-bottom: 1px solid #1a1a1a; padding-bottom: 1.5rem;
        }

        .toolbar::before { content: ""; }

        .filters { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; 
        }
        
        .filter-btn {
            background: transparent; border: 1px solid #333; color: var(--text-muted);
            padding: 0.4rem 1.2rem; border-radius: 50px; cursor: pointer;
            font-size: 0.85rem; font-family: inherit; transition: all 0.3s ease;
        }
        
        .filter-btn:hover { border-color: var(--brand-color); color: var(--brand-color); }
        .filter-btn.active { background: var(--brand-color); color: #fff; border-color: var(--brand-color); }

        .grid-size-control {
            justify-self: end;
            display: flex; align-items: center; gap: 10px;
            color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
        }

        @media (max-width: 900px) {
            .toolbar {
                display: flex; flex-direction: column; justify-content: center;
            }
            .toolbar::before { display: none; }
            .grid-size-control { justify-self: center; }
        }

        .size-btn {
            background: #222; border: none; color: #fff; 
            width: 26px; height
